<body>

<style>
/* Layout: one column, sticky top bar, stacked cards, a sticky action bar when logging a session. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface-2:#E8EDEA; --fg:#14201B; --muted:#5E6E67; --line:#D2DAD6;
  --accent:#0C8766; --accent-fg:#FFFFFF; --accent-soft:#DAF1E8;
  --danger:#BE4136; --danger-soft:#F9E3E0; --warn:#A8701A; --warn-soft:#F7ECD6;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:12px; --shadow:0 1px 2px rgba(20,32,27,.06),0 4px 14px rgba(20,32,27,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#171F1B; --surface-2:#1F2925; --fg:#ECF1EE; --muted:#95A59E; --line:#2A3631;
    --accent:#3FD1A1; --accent-fg:#06231A; --accent-soft:#17382E;
    --danger:#F07D72; --danger-soft:#3C2320; --warn:#E0B263; --warn-soft:#3A2E17;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#171F1B; --surface-2:#1F2925; --fg:#ECF1EE; --muted:#95A59E; --line:#2A3631;
  --accent:#3FD1A1; --accent-fg:#06231A; --accent-soft:#17382E;
  --danger:#F07D72; --danger-soft:#3C2320; --warn:#E0B263; --warn-soft:#3A2E17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input[type=search]::-webkit-search-cancel-button{display:none}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:10px;min-height:52px;max-width:720px;margin:0 auto}
.top h1{font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.top .brand{color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;padding:8px 6px 8px 0;font-size:15px}
.status{font-size:12px;color:var(--muted);min-width:46px;text-align:right}
.status.err{color:var(--danger)}
.iconbtn{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2)}

main{max-width:720px;margin:0 auto;padding-block:14px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card.flat{box-shadow:none}
.banner{background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:14px}
.banner.err{background:var(--danger-soft)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);font-size:22px;margin-bottom:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;
  background:var(--surface-2);color:var(--fg);min-height:42px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ghost{background:transparent;color:var(--accent);padding-inline:8px}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{color:var(--accent);font-weight:600}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--danger-soft);padding:8px 10px;border-radius:10px;font-size:14px}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg{display:inline-flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px}
.seg button{padding:6px 10px;border-radius:7px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg)}

/* client list */
.search{width:100%}
.searchwrap{position:relative}
.searchwrap input{width:100%;padding-right:44px}
.searchwrap .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.searchwrap .clr:hover{background:var(--surface-2);color:var(--fg)}
.setrow input.up{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.prog{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;margin-left:6px}
.prog.down{color:var(--muted);background:var(--surface-2)}
.clist{display:flex;flex-direction:column;gap:8px}
.citem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-height:60px}
.citem:hover{border-color:var(--accent)}
.citem .name{font-family:var(--font-display);font-size:21px;font-weight:600;text-transform:uppercase;letter-spacing:.01em}
.citem .sub{font-size:13px;color:var(--muted)}
.citem .when{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.citem .when b{display:block;color:var(--fg);font-weight:600}

/* day picker */
.daybtn{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.daybtn:hover{border-color:var(--accent)}
.daybtn h3{font-size:22px;text-transform:uppercase;color:var(--accent)}
.daybtn .ex{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.daybtn .last{font-size:13px;margin-top:6px}
.today{border:2px solid var(--accent);background:var(--accent-soft)}

/* session editor */
.sessbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;font-family:var(--font-display);font-weight:700;font-size:18px;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:8px}
.exercise{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 10px}
.exercise .head{display:flex;align-items:flex-start;gap:8px}
.exercise .name{font-family:var(--font-display);font-weight:700;font-size:21px;text-transform:uppercase;line-height:1.15;flex:1;min-width:0}
.exercise .name input{font-family:var(--font-display);font-weight:700;font-size:21px;text-transform:uppercase;width:100%;padding:4px 6px;border-color:transparent;background:transparent}
.exercise .name input:focus{border-color:var(--line);background:var(--surface)}
.exercise .name .nbtn{display:block;width:100%;text-align:left;padding:4px 6px;border-radius:8px;overflow-wrap:anywhere}
.exercise .name .nbtn:hover{background:var(--surface-2)}
.exercise .name .nbtn .pen{font-size:13px;color:var(--muted);font-family:var(--font-body);font-weight:500;text-transform:none;margin-left:6px}
.exercise .last{font-size:13px;color:var(--muted);margin:2px 0 8px 6px}
.exercise .last b{color:var(--fg);font-weight:500}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:22px 1fr 18px 1fr 30px 34px;align-items:center;gap:6px}
.setrow .idx{font-size:13px;color:var(--muted);text-align:right}
.setrow input{text-align:center;font-size:18px;font-weight:500;padding:8px 4px;font-variant-numeric:tabular-nums}
.setrow input::placeholder{color:var(--muted);opacity:.5;font-weight:400}
.setrow .x{text-align:center;color:var(--muted);font-size:15px}
.setrow .unit{font-size:13px;color:var(--muted)}
.setrow .rm{width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.setrow .rm:hover{background:var(--danger-soft);color:var(--danger)}
.exercise .tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.exercise textarea{width:100%;margin-top:8px;min-height:56px;resize:vertical}
.exercise textarea.sticky{margin:0 0 10px;min-height:44px;background:var(--warn-soft);border-color:transparent;font-size:15px}
.exercise .note-text{font-size:14px;margin-top:8px;color:var(--muted);white-space:pre-wrap}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.actionbar .in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}

/* suggestions */
.sugwrap{position:relative;flex:1;min-width:0}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:240px;overflow:auto;margin-top:2px}
.sugg button{display:block;width:100%;text-align:left;padding:9px 12px;font-size:15px;text-transform:uppercase;font-family:var(--font-display);font-weight:600}
.sugg button:hover{background:var(--surface-2)}

/* program editor */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.day .dhead{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.day .dhead input{font-family:var(--font-display);font-weight:700;font-size:22px;text-transform:uppercase;flex:1;min-width:0;padding:4px 8px;color:var(--accent);border-color:transparent;background:transparent}
.day .dhead input:focus{border-color:var(--line);background:var(--surface)}
.prow{display:grid;grid-template-columns:1fr auto;gap:6px 8px;padding:8px 0;border-top:1px solid var(--line)}
.prow .pname{display:flex;gap:6px;align-items:center}
.prow .pname input{width:100%;font-family:var(--font-display);font-weight:600;font-size:18px;text-transform:uppercase;padding:6px 8px}
.prow .pmeta{grid-column:1 / -1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{width:34px;height:34px;font-size:18px;color:var(--accent);background:var(--surface-2)}
.stepper span{min-width:30px;text-align:center;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.prow .pmeta input{width:72px;padding:6px 8px;text-align:center}
.mv{width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:16px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2)}
.mv:disabled{opacity:.3}
.dtools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}

/* history */
.wk{font-family:var(--font-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
.hitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.hitem .hbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px}
.hitem .hbtn .d{font-family:var(--font-display);font-weight:700;font-size:19px;text-transform:uppercase}
.hitem .hbtn .m{font-size:13px;color:var(--muted)}
.hitem .body{padding:0 14px 12px;border-top:1px solid var(--line)}
.hex{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.hex:last-of-type{border-bottom:0}
.hex .n{text-transform:uppercase;font-family:var(--font-display);font-weight:600;font-size:16px}
.hex .s{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hex .nt{grid-column:1 / -1;font-size:13px;color:var(--muted)}
table.ex{width:100%;border-collapse:collapse;font-size:15px}
table.ex th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
table.ex td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.ex td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

.ssgroup{position:relative;border-left:3px solid var(--accent);padding-left:10px;display:flex;flex-direction:column;gap:8px;border-radius:2px}
.ssgroup .sslabel{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ssgroup .sslabel + .prow{border-top:0}
.day .ssgroup{margin:8px 0;border-top:1px solid var(--line);padding-top:8px}
.btn.on{background:var(--accent-soft);color:var(--accent)}
.setrow .idx.pr{font-size:10px;font-weight:700;color:var(--accent-fg);background:var(--accent);border-radius:5px;text-align:center;padding:2px 0;letter-spacing:.03em}
.prbadge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent-fg);background:var(--accent);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.tile .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .d{font-size:13px;color:var(--muted)}
.tile .d.up{color:var(--accent);font-weight:600}
.sumhead h2{font-size:30px;text-transform:uppercase}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 6px 4px}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot.pr{fill:var(--accent)}
.chart .end{fill:var(--accent)}
.chart .endlbl{fill:var(--fg);font-size:12px;font-weight:600;font-family:var(--font-body)}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (min-width:600px){
  .setrow{grid-template-columns:26px 110px 18px 120px 30px 34px}
  .prow{grid-template-columns:1fr auto}
}
</style>

<script>
(function(){
"use strict";
// ---------- helpers ----------
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'hidden') el[k] = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s||'').toUpperCase().replace(/\s+/g,' ').replace(/[\s+*]+$/,'').trim();
const hasVal = x => !!(x && (String(x.reps||'').trim() || String(x.weight||'').trim()));
const logged = s => (s.exercises||[]).some(e => (e.sets||[]).some(hasVal));
const DAYS = ['søn','man','tir','ons','tor','fre','lør'];
const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function fmtDate(iso, withYear){
  if(!iso) return '';
  const d = parseISO(iso); const now = new Date();
  let out = DAYS[d.getDay()]+' '+d.getDate()+'. '+MONTHS[d.getMonth()];
  if (withYear || d.getFullYear() !== now.getFullYear()) out += ' '+d.getFullYear();
  return out;
}
function isoWeek(iso){
  const d = parseISO(iso); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return { week: Math.ceil((((t - y0) / 86400000) + 1) / 7), year: t.getUTCFullYear() };
}
function whenLabel(s){ return s.date ? fmtDate(s.date) : (s.week!=null ? 'uge '+s.week : '?'); }
function weekLabel(s){
  if (s.date){ const w = isoWeek(s.date); return 'Uge '+w.week+' · '+w.year; }
  return 'Numbers · uge '+(s.week!=null ? s.week : '?');
}
function setStr(x){
  const r = String(x.reps||'').trim(), w = String(x.weight||'').trim();
  if (r && w) return r+'×'+w; return r || w;

const queue = new Map();

function save(path, data, delay){
  if (!S.db) { toast('Ingen forbindelse til databasen'); return; }
  if (S.canWrite === false) { toast('Du har kun læseadgang'); return; }
  let q = queue.get(path); if(!q){ q={inflight:false,dirty:false,timer:null,op:'set'}; queue.set(path,q); }

function csvCell(v){ v = v==null ? '' : String(v); return /[";\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function toCSV(clients){
  const rows = [['Klient','Dato','Uge','År','Dag','Øvelse','Superset','Sæt nr','Reps','Vægt','Note','Træningsnote']];
  for (const c of clients) for (const s of c.sessions){
    const wk = s.date ? isoWeek(s.date) : { week: s.week, year: '' };
    const base = [c.name, s.date||'', wk.week!=null ? wk.week : '', wk.year||'', s.dayName||''];
    for (const ex of s.exercises||[]){
      const sets = (ex.sets||[]).filter(hasVal);
      if (!sets.length){ if (ex.note) rows.push([...base, ex.name, ex.superset?'ja':'', '', '', '', ex.note, s.note||'']); continue; }

      const c = clients[i]; setExp('Henter '+c.name+' ('+(i+1)+'/'+clients.length+') …');
      const snap = await S.db.collection('clients/'+c.id+'/sessions').orderBy('seq','desc').limit(1000).get();
      const sessions = snap.docs.map(d => Object.assign({ id:d.id }, normSession(d.data()))).sort((a,b)=>(a.seq||0)-(b.seq||0));
      out.push({ id:c.id, name:c.name, archived:!!c.archived, days:c.days||[], last:c.last||null, sessions });
    }
    const stamp = todayISO(); let filename, data;
    if (format==='json'){ filename = 'klientlog-backup-'+stamp+'.json'; data = JSON.stringify({ app:'Klientlog', exportedAt:new Date().toISOString(), clients: out }, null, 1); }
    else { filename = 'klientlog-'+stamp+'.csv'; data = toCSV(out); }
    const n = out.reduce((a,c)=>a+c.sessions.length,0);
    setExp(plural(out.length,'klient','klienter')+' og '+plural(n,'træning','træninger')+' klar. Bekræft for at gemme filen.');
    const res = await S.downloads.save({ filename, data });
    setExp(res && res.status==='saved' ? 'Gemt som '+filename : 'Filen er sendt videre.');
  } catch(e){
    const code = e && e.code;
    setExp(code==='declined' ? 'Eksport annulleret.' : code==='too_large' ? 'Filen er for stor til denne enhed. Prøv fra computeren.' : 'Kunne ikke eksportere ('+(code||'fejl')+').');
    console.error(e);
  } finally { exporting = false; }
}
async function importBackup(file){
  if (!S.db || exporting) return;
  let json; try { json = JSON.parse(await file.text()); } catch(e){ toast('Filen kunne ikke læses'); return; }
  const list = json && Array.isArray(json.clients) ? json.clients : null;
  if (!list){ toast('Det ligner ikke en Klientlog-backup'); return; }
  exporting = true;
  try {
    const total = list.reduce((a,c)=>a+1+(c.sessions||[]).length, 0); let n = 0;
    setExp('Importerer 0/'+total+' …');
    for (const c of list){
      if (!c || !c.name) continue;
      const cid = c.id || String(c.name).toLowerCase().replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'klient';
      const doc = { name:c.name, archived:!!c.archived, days:c.days||[], last:c.last||null, createdAt:c.createdAt||null, order:String(c.name).toLowerCase(), importedWeeks:c.importedWeeks||null };
      await S.db.doc('clients/'+cid).set(doc); n++;
      for (const x of c.sessions||[]){
        const sid = x.id || ('s'+uid()); const sd = Object.assign({}, x); delete sd.id;
        await S.db.doc('clients/'+cid+'/sessions/'+sid).set(sd); n++;
        if (n % 25 === 0) setExp('Importerer '+n+'/'+total+' …');
      }
    }
    setExp('Importeret: '+plural(list.length,'klient','klienter')+' og '+plural(n-list.length,'træning','træninger')+'.'); toast('Import færdig');
  } catch(e){ console.error(e); setExp('Import stoppede ('+(e&&e.code||'fejl')+'). Prøv igen.'); }
  finally { exporting = false; render(true); }
}
function createClient(name){
  const id = name.toLowerCase().replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'klient';

function summaryData(sid, s){
  const prevSame = S.list.find(x => x.id!==sid && (x.seq||0) < (s.seq||0) && norm(x.dayName)===norm(s.dayName) && logged(x));
  let vol = 0, volPrev = 0, sets = 0, prs = [];
  const rows = [];
  for (const ex of s.exercises||[]){
    const done = (ex.sets||[]).filter(hasVal); if (!done.length) continue;
    sets += done.length; const v = exVolume(done) || 0; vol += v;
    const last = lastFor(ex.name, s.seq, sid); const lv = last ? (exVolume(last.sets)||0) : 0;
    if (prevSame && last && last.s.id===prevSame.id) volPrev += lv;
    const tm = exIsTime(ex, last); const recs = recordsFor(ex, bestsFor(ex.name, s.seq, sid), tm);
    if (recs.list.length) prs.push({ name: ex.name, list: recs.list });
    rows.push({ ex, done, last, recs, delta: last && v && lv ? Math.round(v - lv) : null });
  }
  const start = Date.parse(s.createdAt||''), end = s.updatedAt || 0;
  const mins = start && end && end - start >= 60000 ? Math.round((end - start)/60000) : null;
  return { rows, vol: Math.round(vol), volPrev: Math.round(volPrev), prevSame, sets, prs, mins };
}
function summaryText(c, s, d){
  const lines = [c.name+' · '+(s.dayName||'Træning')+(s.date ? ' · '+fmtDate(s.date, true) : '')];
  for (const r of d.rows){ lines.push(r.ex.name+': '+setsStr(r.done)+(r.recs.list.length ? '  (PR: '+r.recs.list.join(', ')+')' : '')); }
  lines.push('');
  if (d.vol) lines.push('Volumen: '+d.vol.toLocaleString('da-DK')+' kg'+(d.prevSame && d.volPrev ? ' ('+(d.vol-d.volPrev>=0?'+':'')+(d.vol-d.volPrev).toLocaleString('da-DK')+' kg mod sidst)' : ''));
  lines.push('Sæt: '+d.sets+(d.mins ? ' · Tid: '+d.mins+' min' : ''));
  if (d.prs.length) lines.push('Nye rekorder: '+d.prs.length);
  return lines.join('\n');
}

  function renameExercise(i, name){
    name = String(name||'').trim(); const ex = s.exercises[i]; if (name===ex.name) return;

        h('button',{class:'btn sm', onclick:()=>{ S.orderOffer=false; render(true); }},'Nej'));

function applyOrder(day, s){
  const byKey = new Map(); for (const x of day.exercises||[]){ const k=norm(x.name); if (k && !byKey.has(k)) byKey.set(k, x); }
  const out = [], used = new Set();
  for (const x of s.exercises){ const k=norm(x.name); if (k && byKey.has(k) && !used.has(k)){ out.push(byKey.get(k)); used.add(k); } }
  for (const x of day.exercises||[]){ const k=norm(x.name); if (!k || !used.has(k)){ out.push(x); if (k) used.add(k); } }
  day.exercises = out;
}

function renderPerExercise(stack){
  const names = new Map();
  for (const s of S.list) for (const e of s.exercises||[]){ const k=norm(e.name); if (k && (e.sets||[]).some(hasVal)) names.set(k, names.get(k)||e.name); }
  const opts = [...names.entries()].sort((a,b)=>a[1].localeCompare(b[1],'da'));
  if (!S.histEx || !names.has(S.histEx)) S.histEx = opts.length ? opts[0][0] : '';
  const sel = h('select',{style:'width:100%', 'aria-label':'Vælg øvelse', onchange:(ev)=>{ S.histEx=ev.target.value; render(); }}, opts.map(([k,n]) => h('option',{value:k, selected:k===S.histEx}, n)));
  stack.append(sel);
  const rows = [];
  for (const s of S.list){ const e=(s.exercises||[]).find(e=>norm(e.name)===S.histEx && (e.sets||[]).some(hasVal)); if (e) rows.push({s, e}); }
  const best = rows.reduce((m,{e})=>{ for(const x of e.sets){ const w=toNum(x.weight); if (w!=null && w>m) m=w; } return m; }, -Infinity);
  const tbl = h('table',{class:'ex'}, h('thead',null, h('tr',null, h('th',null,'Hvornår'), h('th',null,'Sæt'), h('th',{style:'text-align:right'},'Volumen'))));
  const tb = h('tbody');
  for (const {s,e} of rows){
    const v = volume(e.sets);
    tb.append(h('tr',null, h('td',null, s.date ? fmtDate(s.date, true) : 'Uge '+s.week, h('div',{class:'small muted'}, s.dayName)), h('td',{class:'num'}, setsStr(e.sets)), h('td',{class:'r'}, v!=null ? Math.round(v)+' kg' : '–')));
  }

  stack.append(h('div',{class:'small muted'}, rows.length+' gange logget', isFinite(best) && best>-Infinity ? ' · tungeste sæt '+fmtNum(best)+' kg' : ''));
  const chrono = rows.slice().reverse();
  const tm = chrono.some(({e}) => e.mode==='time' || (e.sets||[]).some(x=>isTimeStr(x.reps)));
  const hasW = chrono.some(({e}) => e.sets.some(x => (toNum(x.weight)||0) > 0));
  const metrics = hasW
    ? [['top','Tungeste sæt', e => { let m=null; for (const x of e.sets.filter(hasVal)){ const w=toNum(x.weight); if (w!=null && (m==null||w>m)) m=w; } return m; }, ' kg'],
       ['rm','Est. 1RM', e => { let m=null; for (const x of e.sets.filter(hasVal)){ const v=e1rm(x); if (v!=null && (m==null||v>m)) m=v; } return m!=null ? Math.round(m*10)/10 : null; }, ' kg'],
       ['vol','Volumen', e => { const v = exVolume(e.sets.filter(hasVal)); return v!=null ? Math.round(v) : null; }, ' kg']]
    : [['reps', tm ? 'Længste tid' : 'Flest reps', e => { let m=null; for (const x of e.sets.filter(hasVal)){ const r=repVal(x.reps); if (r!=null && (m==null||r>m)) m=r; } return m; }, tm ? ' s' : ''],

  if (!metrics.some(m => m[0]===S.histMetric)) S.histMetric = metrics[0][0];
  const metric = metrics.find(m => m[0]===S.histMetric);
  stack.append(h('div',{class:'seg', style:'align-self:flex-start;flex-wrap:wrap'}, metrics.map(m => h('button',{class:m[0]===S.histMetric?'on':'', onclick:()=>{ S.histMetric=m[0]; render(); }}, m[1]))));
  const pts = chrono.map(({s,e}) => ({ v: metric[2](e), label: s.date ? (parseISO(s.date).getDate()+'/'+(parseISO(s.date).getMonth()+1)) : 'u'+s.week })).filter(p => p.v!=null);
  if (pts.length >= 2) stack.append(lineChart(pts, metric[3]));
  else stack.append(h('div',{class:'small muted'}, 'Grafen kommer når øvelsen er logget mindst to gange.'));
  stack.append(h('div',{class:'tablewrap'}, tbl));
}

function lineChart(pts, unit){
  const W = 360, H = 190, L = 34, R = 8, T = 18, B = 22;
  const vals = pts.map(p=>p.v); let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi){ lo -= 1; hi += 1; }
  const step = niceStep((hi - lo) / 4); lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const x = i => L + (pts.length===1 ? 0 : i*(W-L-R)/(pts.length-1));
  const y = v => T + (hi - v)*(H-T-B)/(hi - lo);
  const ns = 'http://www.w3.org/2000/svg'; const el = (t, a, txt) => { const n = document.createElementNS(ns, t); for (const k in a) n.setAttribute(k, a[k]); if (txt!=null) n.textContent = txt; return n; };
  const svg = el('svg', { viewBox:'0 0 '+W+' '+H, role:'img', 'aria-label':'Udvikling over tid' });
  for (let v = lo; v <= hi + 1e-9; v += step){
    svg.appendChild(el('line', { class:'grid', x1:L, x2:W-R, y1:y(v), y2:y(v) }));
    svg.appendChild(el('text', { class:'ax', x:L-5, y:y(v)+4, 'text-anchor':'end' }, fmtNum(Math.round(v*10)/10)));
  }
  const every = Math.max(1, Math.ceil(pts.length / 5));
  pts.forEach((p, i) => { if (i % every === 0 || i === pts.length-1) svg.appendChild(el('text', { class:'ax', x:x(i), y:H-5, 'text-anchor': i===0 ? 'start' : i===pts.length-1 ? 'end' : 'middle' }, p.label)); });
  const d = pts.map((p,i) => (i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  svg.appendChild(el('path', { class:'ar', d: d+' L'+x(pts.length-1).toFixed(1)+' '+(H-B)+' L'+L+' '+(H-B)+' Z' }));
  svg.appendChild(el('path', { class:'ln', d }));
  let run = -Infinity;
  pts.forEach((p, i) => { const pr = p.v > run && i > 0; if (p.v > run) run = p.v; if (i < pts.length-1 && pts.length <= 40) svg.appendChild(el('circle', { class:'dot'+(pr?' pr':''), cx:x(i), cy:y(p.v), r: 3.5 })); });
  const lp = pts[pts.length-1];
  svg.appendChild(el('circle', { class:'end', cx:x(pts.length-1), cy:y(lp.v), r:5.5 }));
  svg.appendChild(el('text', { class:'endlbl', x:x(pts.length-1), y: y(lp.v) - 12 < T + 4 ? y(lp.v) + 20 : y(lp.v) - 12, 'text-anchor':'end' }, fmtNum(lp.v)+unit));
  return h('div',{class:'chart'}, svg);
}
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw||1))); const f = raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }

// ---------- routing & boot ----------
function route(){
  if (!S.cid) S.homeScroll = window.scrollY;
  const hsh = location.hash.replace(/^#/, '');
  const m = /^k-(.+)$/.exec(hsh);
  const cid = m ? m[1] : null;
  if (cid !== S.cid){
    if (S.unsub){ S.unsub(); S.unsub=null; }
    flushAll(); dropWork(S.cid);
    S.cid = cid; S.sessions = new Map(); S.list=[]; S.sessionsLoaded=false; S.edit=null; S.summary=null; S.offers=[]; S.orderOffer=false; S.menu=false; S.confirm=null; S.expanded=new Set(); S.histEx='';
    if (cid && S.tab!=='program') S.tab = 'train';
    if (cid && S.db) subscribeSessions(cid);
  }
  if (!cid) S.tab='train';
  render(true);
  if (!cid) window.scrollTo(0, S.homeScroll||0); else window.scrollTo(0,0);
}
function subscribeSessions(cid){
  let timer = setTimeout(()=>{ if(!S.sessionsLoaded){ toast('Historikken er langsom at hente …'); } }, 10000);
  S.unsub = S.db.collection('clients/'+cid+'/sessions').orderBy('seq','desc').limit(1000).onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    const next = new Map();
    for (const d of snap.docs){
      const p = spath(cid, d.id);
      if (pending(p) && S.sessions.has(d.id)) next.set(d.id, S.sessions.get(d.id)); else next.set(d.id, normSession(d.data()));
    }
    // keep locally created sessions whose write is still pending
    for (const [id, s] of S.sessions) if (!next.has(id) && pending(spath(cid,id))) next.set(id, s);
    S.sessions = next; rebuildList(); S.sessionsLoaded = true;
    if (S.edit && S.edit.persisted && !S.sessions.has(S.edit.sid) && !pending(spath(cid,S.edit.sid))){ S.edit=null; toast('Træningen blev slettet et andet sted'); }
    render();
  }, err => { clearTimeout(timer); S.sessionsLoaded = true; console.error(err); toast('Kunne ikke hente historik ('+(err&&err.code||'fejl')+')'); render(); });
}
async function boot(){
  window.addEventListener('hashchange', route);
  route();
  if (!window.claude || !window.claude.use){ S.dbState='none'; render(true); return; }
  const [db, user, downloads] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
  if (!db){ S.dbState='none'; render(true); return; }
  S.db = db; S.user = user; S.downloads = downloads;
  try { if (user && user.can) S.canWrite = await user.can('data.write'); } catch(e){ S.canWrite = null; }
  S.dbState='ready';
  const timer = setTimeout(()=>{ if(!S.clientsLoaded){ S.clientsLoaded=true; toast('Databasen svarer langsomt …'); render(true); } }, 10000);
  db.collection('clients').orderBy('order').limit(1000).onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    const next = new Map();
    for (const d of snap.docs){ next.set(d.id, pending(cpath(d.id)) && S.clients.has(d.id) ? S.clients.get(d.id) : normClient(d.data())); if (!pending(cpath(d.id)) && S.mounted!=='prog:'+d.id && !(S.edit && S.cid===d.id)) delete S.work[d.id]; }
    for (const [id, c] of S.clients) if (!next.has(id) && pending(cpath(id))) next.set(id, c);
    S.clients = next; S.clientsLoaded = true;
    render();
  }, err => { clearTimeout(timer); S.clientsLoaded = true; console.error(err); toast('Kunne ikke hente klienter ('+(err&&err.code||'fejl')+')'); render(true); });
  if (S.cid) subscribeSessions(S.cid);
}
boot();
})();
</script>
